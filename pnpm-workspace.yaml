packages:
  - apps/*
  - packages/core
  - packages/client
  - packages/plugin-web
  - packages/cloudflare

# Versions packages must share exactly. Pi's API changes between releases, and
# the client's Hono types the server's routes. MCP transports cross the
# core/daemon boundary and use the same SDK version.
catalog:
  '@earendil-works/chord': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@earendil-works/pi-durable': 1.4.0
  '@modelcontextprotocol/client': 2.4.0
  '@modelcontextprotocol/server': 2.4.0
  hono: 4.13.13

# Install scripts are off unless listed. None of these need theirs for Familiar.
allowBuilds:
  '@google/genai': false
  protobufjs: false
  esbuild: true
  # Its script only fetches a platform binary when pnpm didn't install one.
  workerd: false
