packages:
  - apps/*
  - packages/core
  - packages/client

# Versions packages must share exactly. Pi's API changes between releases, and
# the client's Hono types the server's routes.
catalog:
  '@earendil-works/chord': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@earendil-works/pi-durable': 1.4.0
  hono: 4.13.13

# Install scripts are off unless listed. None of these need theirs for Familiar.
allowBuilds:
  '@google/genai': false
  protobufjs: false
  esbuild: true
