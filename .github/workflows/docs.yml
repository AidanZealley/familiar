name: Docs

# Builds the site on pull requests that touch it, and deploys main to GitHub
# Pages. Needs Settings > Pages > Source set to GitHub Actions.
on:
  pull_request:
    # Everything the site is built from. A change outside these paths doesn't
    # redeploy it, so add any folder the docs start reading (see the note at
    # the top of apps/docs/astro.config.ts).
    paths: &paths
      - 'apps/docs/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, without cancelling one already under way.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # Builds the site and its search index, then checks every internal link.
      - run: pnpm build:docs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
