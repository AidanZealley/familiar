name: Computer image

# The computers' image, published to ghcr.io as `<image>:<key>` only when no
# image has that key yet. The key is a hash of what goes into the image
# (packages/computer/scripts/image-key.ts), committed in image.json, which is
# what packages name; so a release whose image is unchanged publishes nothing
# here. Workflows that publish a package naming the key run this first, so
# every key a package names exists, for both platforms, before it's published.
# It can also be run by hand on any branch (`gh workflow run computer-image.yml
# --ref <branch>`), to publish or check that branch's image without a release.
on:
  workflow_call:
  workflow_dispatch:

# What publishing to ghcr.io needs, when run by hand; a caller grants the same.
permissions:
  contents: read
  packages: write

jobs:
  # Stages the build context and its key. The platform builds use this one
  # context, so the image is exactly what was hashed.
  key:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.key.outputs.image }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --filter @familiar-ai/computer...
      - id: key
        name: Stage the image and check image.json names it
        run: |
          echo "image=$(node packages/computer/scripts/image-key.ts)" >> "$GITHUB_OUTPUT"
          git diff --exit-code packages/computer/image.json
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Signed in, so a published image that isn't public yet still counts.
      - id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE: ${{ steps.key.outputs.image }}
      # As a tar, which keeps the executable bit an artifact would drop.
      - if: steps.exists.outputs.exists == 'false'
        run: tar -cf context.tar -C packages/computer/image .
      - if: steps.exists.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: computer-image-context
          path: context.tar
          if-no-files-found: error

  # Each platform built natively and pushed by digest alone, untagged.
  build:
    needs: key
    if: needs.key.outputs.exists == 'false'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: computer-image-context
      - run: mkdir context && tar -xf context.tar -C context
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: repository
        run: echo "name=${IMAGE%:*}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ needs.key.outputs.image }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: context
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.repository.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Save the digest
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: computer-image-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error

  # Tags both platforms' images as one, `<image>:<key>`, unless that tag
  # exists: a key's tag is never moved. Runs one at a time per key, so two
  # workflows that built the same new key can't both tag it.
  publish:
    needs: [key, build]
    if: ${{ !cancelled() && needs.key.result == 'success' && needs.build.result != 'failure' }}
    concurrency: computer-image-${{ needs.key.outputs.image }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.key.outputs.image }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: computer-image-ubuntu-*
          path: digests
          merge-multiple: true
      - name: Tag the image
        if: needs.build.result == 'success'
        working-directory: digests
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE was published meanwhile; its tag stays"
          else
            # One `<repository>@sha256:<digest>` per platform's digest file.
            for digest in *; do echo "${IMAGE%:*}@sha256:$digest"; done \
              | xargs docker buildx imagetools create --tag "$IMAGE"
          fi
      # Hosts pull the image without signing in, and a new ghcr.io package is
      # private until made public in its settings, so this fails until anyone
      # can read it, for every platform.
      - name: Check the image is public
        run: |
          docker logout ghcr.io
          docker manifest inspect "$IMAGE" \
            | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")'
