name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && pnpm exec prettier --check .
      - run: pnpm bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: pnpm test:release
      - name: Publish release package
        run: gh release create "$RELEASE_VERSION" apps/daemon/dist/familiar.tgz install.sh install.ps1 --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
