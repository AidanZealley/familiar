name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Publishes the computers' image to ghcr.io.
  packages: write
  # npm trusted publishing exchanges the workflow's OIDC token for a
  # short-lived publish token, so the repo stores no npm secret.
  id-token: write

jobs:
  # The computers' image, built natively for each platform and pushed by
  # digest alone, untagged; the release job tags both as one image once its
  # checks pass. Nothing in the image depends on the release's version.
  computer-image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The image's name, kept once in the computer package's config.
      - run: echo "COMPUTER_IMAGE=$(jq -r .config.image packages/computer/package.json)" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/computer/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.COMPUTER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Save the digest
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: computer-image-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error

  release:
    needs: computer-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm exec prettier --check .
      - run: pnpm test:cloudflare
      - run: pnpm --filter @familiar-example/cloudflare-worker build
      # The libraries share the release's version, set here so the checkout
      # never carries one. Before bundling, because the daemon's computers use
      # the image tagged with the computer package's version.
      - run: pnpm --filter './packages/*' exec npm pkg set version="${RELEASE_VERSION#v}"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: pnpm bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: pnpm test:release
      - run: pnpm test:packages
      - run: pnpm --filter './packages/*' pack --pack-destination npm-packages
      # Each publish step skips what an earlier attempt finished, so a failed
      # run can be rerun.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: computer-image-*
          path: digests
          merge-multiple: true
      # Both platforms' images as one, tagged with the version the daemon's
      # computers use (the computer package's, set above), before the release
      # that pulls it. Docker picks the host's platform from it. Tagging it
      # again is harmless.
      # The image's name, kept once in the computer package's config.
      - run: echo "COMPUTER_IMAGE=$(jq -r .config.image packages/computer/package.json)" >> "$GITHUB_ENV"
      - name: Publish computer image
        working-directory: digests
        run: |
          printf '%s@sha256:%s\n' "$COMPUTER_IMAGE" * \
            | xargs docker buildx imagetools create --tag "$COMPUTER_IMAGE:${RELEASE_VERSION#v}"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      # Hosts pull the image without signing in, and a new ghcr.io package is
      # private until made public in its settings, so the release stops here
      # until anyone can read it, for every platform.
      - name: Check the computer image is public
        run: |
          docker logout ghcr.io
          docker manifest inspect "$COMPUTER_IMAGE:${RELEASE_VERSION#v}" \
            | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Publish release package
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists"
          else
            gh release create "$RELEASE_VERSION" apps/daemon/dist/familiar.tgz install.sh install.ps1 --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
      # pnpm pack resolves workspace: and catalog: versions; npm publishes,
      # because it handles trusted publishing and provenance. Prereleases go
      # to `next`, so `latest` only ever installs a stable version.
      - name: Publish npm packages
        run: |
          tag=latest
          case "$RELEASE_VERSION" in *-*) tag=next ;; esac
          for package in npm-packages/*.tgz; do
            spec=$(tar -xzOf "$package" package/package.json | jq -r '.name + "@" + .version')
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already published"
            else
              # Without ./ npm reads owner/name.tgz as a GitHub repository.
              npm publish "./$package" --access public --tag "$tag"
            fi
          done
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
